[package]
name = "viet_hoa"
version = "0.2.9"
edition = "2021"
description = "Việt Hóa – dịch màn hình game, Việt hóa, lồng tiếng, phụ đề phim"

[[bin]]
name = "VietHoa"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", features = ["json"] }
strsim = "0.11"
regex = "1"
fancy-regex = "0.14"
csv = "1"
encoding_rs = "0.8"
md5 = "0.7"
winreg = "0.55"
unicode-normalization = "0.1"
rfd = "0.15"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
lz4_flex = "0.11"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
flate2 = "1.1.11"

[dependencies.windows]
version = "0.61"
features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Multimedia",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
