name: Phát hành

# Đẩy tag dạng v0.2.0 (khớp version trong Cargo.toml) → build exe, tạo bản phát hành trên GitHub
# kèm VietHoa.exe (app tự cập nhật từ file này) và gói zip độc lập.
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Đẩy lên main kèm tăng version trong Cargo.toml → tự phát hành (không cần đẩy tag).
      # Version đã có Release thì bỏ qua.
      - name: Xem version đã phát hành chưa
        id: chk
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "ver=$ver" >> $env:GITHUB_OUTPUT
          gh release view "v$ver" --repo "${{ github.repository }}" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { "bo=true" >> $env:GITHUB_OUTPUT } else { "bo=false" >> $env:GITHUB_OUTPUT }
          $global:LASTEXITCODE = 0

      - name: Kiểm tra tag khớp version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($ver -ne $tag) { throw "Tag v$tag không khớp version Cargo.toml ($ver)" }

      - if: steps.chk.outputs.bo != 'true'
        uses: dtolnay/rust-toolchain@stable

      - if: steps.chk.outputs.bo != 'true'
        uses: Swatinem/rust-cache@v2

      - name: Build release
        if: steps.chk.outputs.bo != 'true'
        run: cargo build --release --locked

      - name: Đóng gói
        if: steps.chk.outputs.bo != 'true'
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $thu = "dist/VietHoa_$ver"
          New-Item -ItemType Directory -Force $thu, "$thu/scripts" | Out-Null
          Copy-Item target/release/VietHoa.exe $thu
          Copy-Item scripts/* "$thu/scripts"
          Remove-Item "$thu/scripts/dong_goi.ps1" -ErrorAction SilentlyContinue
          "Giải nén, mở VietHoa.exe > Cài đặt > Tải công cụ còn thiếu. Xem NOTES.md." | Set-Content -Encoding UTF8 "$thu/HUONG_DAN.txt"
          Compress-Archive -Path "$thu/*" -DestinationPath "dist/VietHoa_$ver.zip"
          Copy-Item target/release/VietHoa.exe dist/VietHoa.exe

      - name: Tạo bản phát hành
        if: steps.chk.outputs.bo != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.chk.outputs.ver }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/VietHoa.exe
            dist/VietHoa_*.zip
          generate_release_notes: true
